<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Xenzia — Red/Black (Stable v5.0)</title>
<style>
  :root {
    --bg: #070709;
    --bg2: #0b0b0f;
    --accent: #f43f5e;
    --muted: #9ca3af;
    --grid: #1a0f13;
    --text: #f3f4f6;
  }
  html, body { height: 100%; margin: 0; background: radial-gradient(1200px 800px at 80% -10%, #14090c 0%, var(--bg) 60%); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
  .wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 14px 18px; background: linear-gradient(180deg, rgba(40,8,14,.7), rgba(20,6,10,.2)); border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 14px; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; font-weight: 800; }
  header .hint { color: var(--muted); font-size: 13px; }
  main { display: grid; place-items: center; padding: 16px; }
  .board-wrap { width: min(90vw, 560px); aspect-ratio: 1 / 1; background: linear-gradient(180deg, var(--bg2), var(--bg)); border: 1px solid rgba(255,255,255,.06); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06); position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .hud { position: absolute; inset: 10px 10px auto 10px; display: flex; justify-content: space-between; gap: 10px; z-index: 2; pointer-events: none; }
  .badge { background: rgba(20,6,10,.55); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; font-size: 13px; letter-spacing: .03em; display: inline-flex; align-items: center; gap: 8px; pointer-events: auto; }
  .badge strong { color: #fff; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(800px 600px at 50% 30%, rgba(20,6,10,.65), rgba(10,4,6,.92)); color: #ffe4e6; text-align: center; z-index: 3; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card { background: linear-gradient(180deg, rgba(30,6,10,.9), rgba(12,4,7,.95)); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 18px; max-width: 720px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .card h2 { margin: 8px 0 10px; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .card p { color: #ffd5da; margin: 8px 0 0; line-height: 1.5; font-size: 14px; }
  .big-red { color: #ff3030; font-weight: 900; font-size: clamp(22px, 4.5vw, 40px); text-transform: uppercase; letter-spacing: .08em; line-height: 1.15; text-shadow: 0 0 14px rgba(255,48,48,.2); }
  .final-big { font-size: clamp(24px, 5vw, 44px); font-weight: 900; color: #ff4040; letter-spacing: .06em; text-transform: uppercase; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
  .btn { appearance: none; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(180deg, #2a0a10, #1a070b); color: #ffeef0; border-radius: 10px; padding: 10px 14px; font-size: 14px; cursor: pointer; transition: transform .06s ease, filter .2s ease, border-color .2s ease, background .2s; }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.primary { border-color: rgba(244,63,94,.6); box-shadow: 0 0 0 2px rgba(244,63,94,.12) inset; }
  .txt { width: min(80vw, 360px); background: #120508; border: 1px solid rgba(255,255,255,.16); color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none; }
  .txt:focus { border-color: rgba(244,63,94,.5); box-shadow: 0 0 0 3px rgba(244,63,94,.12); }
  .err { color: #ff6b81; font-weight: 700; margin-top: 8px; min-height: 1.2em; }
  footer { padding: 10px 16px 18px; color: var(--muted); text-align: center; font-size: 12px; }
  .mobile-note { display: none; font-size: 12px; color: #ffb3bf; margin-top: 8px; text-align: center; }
  @media (max-width: 740px) { .mobile-note { display: block; }
    .final-big { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Snake Xenzia — Hard Mode</h1>
    <div class="hint">Reach <strong>2000</strong> points to win • Arrows / WASD • P = Pause • R / Space = Restart</div>
  </header>

  <main>
    <div class="board-wrap" id="boardWrap" aria-label="Snake game board">
      <div class="hud">
        <div class="badge">Score: <strong id="score">0</strong></div>
        <div class="badge">Best: <strong id="best">0</strong></div>
        <div class="badge">Speed: <strong id="speed">0</strong> tps</div>
      </div>

      <div class="overlay show" id="overlay">
        <div class="card" id="introCard">
          <h2 id="overlayTitle">Enter Code</h2>
          <p class="big-red">ENTER YOUR CODE TO UNLOCK NEXT TASK</p>
          <input id="codeInput" class="txt" type="password" placeholder="Enter code..." autocomplete="off" inputmode="text" />
          <div class="controls">
            <button class="btn primary" id="unlockBtn">Unlock</button>
          </div>
          <div id="codeErr" class="err"></div>
          <p class="mobile-note">Hint: The code is for SLVLOG 2.0</p>
        </div>
      </div>

      <canvas id="game" width="520" height="520"></canvas>
    </div>
  </main>

  <footer>© 2025 Snake Xenzia Hard — Red/Black Stable.</footer>
</div>

<!-- JSON CONFIG -->
<script type="application/json" id="snake-config">
{
  "grid": { "cols": 20, "rows": 20, "cellSize": 22 },
  "initial": { "length": 5, "tickPerSecond": 8, "direction": "right" },
  "winScore": 2000,
  "food": {
    "normal": { "chance": 0.72, "score": 100, "growBy": 2 },
    "rotten": { "chance": 0.18, "score": -100, "growBy": -1 },
    "golden": { "chance": 0.10, "score": 250, "growBy": 4 }
  },
  "speedRamp": { "everyPoints": 320, "increment": 1.2, "maxTPS": 28 },
  "obstacles": { "startAtScore": 300, "addEveryPoints": 240, "maxCount": 26 },
  "colors": {
    "bgA": "#0b0b0f",
    "bgB": "#070709",
    "snakeHead": "#f43f5e",
    "snakeBody": "#ef4444",
    "food": "#eab308",
    "rotten": "#ef4444",
    "golden": "#f59e0b",
    "obstacle": "#1f0e12",
    "grid": "#1a0f13"
  }
}
</script>

<script>
(() => {
  "use strict";
  const $ = sel => document.querySelector(sel);
  const cfg = JSON.parse(document.getElementById("snake-config").textContent);

  const canvas = $("#game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const overlay = $("#overlay");
  const scoreEl = $("#score");
  const bestEl  = $("#best");
  const speedEl = $("#speed");
  const introCard = $("#introCard");

  const BEST_KEY = "snake_xenzia_hard_best";
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  // Focus the code input on load
  setTimeout(() => { const ci=$("#codeInput"); if (ci) ci.focus(); }, 10);

  // Mic sprite
  const mic = new Image();
  mic.src = "assets/mic.png";
  let micReady = false;
  mic.onload = () => { micReady = true; };

  // WebAudio SFX
  let audio, masterGain;
  const MIDI = { freq: (n) => 440 * Math.pow(2, (n - 69) / 12) };
  function initAudio() {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audio.createGain();
      masterGain.gain.value = 0.12;
      masterGain.connect(audio.destination);
    }
  }
  function playSeq(notes, tempoMs=120, type="triangle", vol=0.16) {
    if (!audio) return;
    const start = audio.currentTime;
    notes.forEach((n,i) => {
      const when = start + (i * tempoMs)/1000;
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type; o.frequency.value = MIDI.freq(n);
      g.gain.value = vol; g.gain.setValueAtTime(vol, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + tempoMs/1000*0.9);
      o.connect(g); g.connect(masterGain);
      o.start(when); o.stop(when + tempoMs/1000);
    });
  }
  const sfx = {
    eat: () => playSeq([76, 79, 83], 70),
    eatRotten: () => playSeq([55, 50, 43], 90, "square", 0.2),
    eatGolden: () => playSeq([84, 88, 91, 95], 80, "sawtooth", 0.18),
    hit: () => playSeq([40, 38, 35], 110, "square", 0.22),
    win: () => playSeq([72, 76, 79, 84, 88, 91], 110, "triangle", 0.2)
  };

  function resizeCanvas() {
    const wrap = document.getElementById("boardWrap");
    const size = Math.min(wrap.clientWidth, wrap.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGrid();
  }
  window.addEventListener("resize", resizeCanvas, { passive: true });

  const COLS = cfg.grid.cols;
  const ROWS = cfg.grid.rows;
  const DIRS = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };

  let state;
  let rafId = null, acc = 0, isPaused = false;

  function newGame() {
    const mid = { x: Math.floor(COLS/2), y: Math.floor(ROWS/2) };
    const len = cfg.initial.length;
    const snake = [];
    for (let i=0;i<len;i++) snake.unshift({ x: mid.x - i, y: mid.y });
    state = {
      tickPerSecond: cfg.initial.tickPerSecond,
      dir: "right", nextDir: "right",
      snake, pendingGrowth: 0,
      food: spawnFood([]), obstacles: [],
      score: 0, ticks: 0, over: false, win: false, lastFrameTime: 0,
      started: false
    };
    scoreEl.textContent = 0;
    speedEl.textContent = state.tickPerSecond.toFixed(1);
    drawAll();
  }

  function randomFoodType() {
    const r = Math.random();
    const { normal, rotten, golden } = cfg.food;
    if (r < normal.chance) return "normal";
    if (r < normal.chance + rotten.chance) return "rotten";
    return "golden";
  }
  function spawnFood(occupied) {
    let pos, guard=0;
    do { pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; guard++; if (guard>500) break; }
    while (isOccupied(pos, occupied));
    return { ...pos, kind: randomFoodType() };
  }
  function isOccupied(pos, arr){ return arr.some(p => p.x===pos.x && p.y===pos.y); }

  function addObstaclesIfNeeded() {
    const { startAtScore, addEveryPoints, maxCount } = cfg.obstacles;
    if (state.score < startAtScore) return;
    const want = Math.min(Math.floor((state.score - startAtScore) / addEveryPoints) + 1, maxCount);
    while (state.obstacles.length < want) {
      const length = 1 + Math.floor(Math.random()*3);
      let placed = 0, trials = 0;
      while (placed < length && trials < 100) {
        const p = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
        const occupied = [...state.snake, state.food, ...state.obstacles];
        if (!isOccupied(p, occupied)) { state.obstacles.push(p); placed++; }
        trials++;
      }
      if (trials >= 100) break;
    }
  }

  function rampSpeedIfNeeded() {
    const { everyPoints, increment, maxTPS } = cfg.speedRamp;
    const steps = Math.floor(state.score / everyPoints);
    const target = Math.min(cfg.initial.tickPerSecond + steps * increment, maxTPS);
    if (target > state.tickPerSecond) { state.tickPerSecond = target; speedEl.textContent = state.tickPerSecond.toFixed(1); }
  }

  const DIR_KEYS = { ArrowLeft:"left",KeyA:"left", ArrowRight:"right",KeyD:"right", ArrowUp:"up",KeyW:"up", ArrowDown:"down",KeyS:"down" };
  document.addEventListener("keydown", (e) => {
    // Ignore global controls while overlay visible or typing in inputs
    const ae = document.activeElement;
    const isInput = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
    if (isInput || overlay.classList.contains("show")) return;

    const d = DIR_KEYS[e.code];
    if (d){
      e.preventDefault();
      queueDirection(d);
      if (state && !state.started) state.started = true;
      return;
    }
    if (e.code==="KeyP") togglePause();
    if (e.code==="KeyR" || e.code==="Space"){ if (state?.over || state?.win || isPaused){ startGame(); } }
  }, { passive: false });

  function queueDirection(next){
    if (!state || state.over) return;
    const opp = { left:"right", right:"left", up:"down", down:"up" };
    if (opp[next] === state.dir) return;
    state.nextDir = next;
  }

  function startLoop(){ cancelAnimationFrame(rafId); isPaused=false; state.lastFrameTime=performance.now(); acc=0; rafId=requestAnimationFrame(frame); }
  function togglePause(){
    if (!state || state.over || state.win) return;
    isPaused=!isPaused;
    overlayTitle("Paused");
    overlayDesc("Press <b>P</b> to resume, <b>R</b>/<b>Space</b> to restart.");
    overlay.classList.toggle("show", isPaused);
    if (!isPaused){ state.lastFrameTime=performance.now(); rafId=requestAnimationFrame(frame); }
  }
  function frame(now){
    const dt=(now-state.lastFrameTime)/1000; state.lastFrameTime=now;
    if (!isPaused){ acc+=dt; const step=1/state.tickPerSecond;
      while (acc>=step){ tick(); acc-=step; }
      drawAll();
      if (!state.over && !state.win) rafId=requestAnimationFrame(frame);
    }
  }

  function tick(){
    if (!state.started) return; // wait-to-start
    state.dir = state.nextDir;
    const head = { ...state.snake[0] };
    const d = DIRS[state.dir]; head.x += d.x; head.y += d.y;

    // wall collision
    if (head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS){ sfx.hit(); return gameOver(); }
    // self collision
    if (isOccupied(head, state.snake)){ sfx.hit(); return gameOver(); }
    // obstacle collision
    if (isOccupied(head, state.obstacles)){ sfx.hit(); return gameOver(); }

    let ate=false;
    if (head.x===state.food.x && head.y===state.food.y){
      ate = true;
      const kind=state.food.kind; const fcfg=cfg.food[kind];
      state.score += fcfg.score; scoreEl.textContent = state.score;
      state.pendingGrowth += Math.max(0, fcfg.growBy);
      if (fcfg.growBy<0 && state.snake.length>3){ state.snake.pop(); }
      state.food = spawnFood([...state.snake, head, ...state.obstacles]);
      rampSpeedIfNeeded(); addObstaclesIfNeeded();
      if (kind==="normal") sfx.eat(); else if (kind==="rotten") sfx.eatRotten(); else sfx.eatGolden();
    }

    state.snake.unshift(head);
    if (!ate){
      if (state.pendingGrowth>0){ state.pendingGrowth--; } else { state.snake.pop(); }
    }

    if (state.score >= cfg.winScore){ sfx.win(); return youWin(); }
  }

  function drawGrid(){
    const w=canvas.clientWidth, h=canvas.clientHeight;
    ctx.fillStyle = cfg.colors.bgB; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = cfg.colors.grid; ctx.lineWidth = 1;
    const cw=w/COLS, ch=h/ROWS; ctx.beginPath();
    for (let x=1;x<COLS;x++){ const px=Math.floor(x*cw)+.5; ctx.moveTo(px,0); ctx.lineTo(px,h); }
    for (let y=1;y<ROWS;y++){ const py=Math.floor(y*ch)+.5; ctx.moveTo(0,py); ctx.lineTo(w,py); }
    ctx.stroke();
  }

  function drawCellRect(x,y,color){
    const cw=canvas.clientWidth/COLS, ch=canvas.clientHeight/ROWS;
    const pad=Math.max(1, Math.floor(Math.min(cw,ch)*0.08));
    const px=Math.floor(x*cw)+pad, py=Math.floor(y*ch)+pad;
    const pw=Math.floor(cw-pad*2), ph=Math.floor(ch-pad*2);
    ctx.fillStyle=color; ctx.fillRect(px,py,pw,ph);
  }

  function drawMicFood(x,y,kind){
    const cw=canvas.clientWidth/COLS, ch=canvas.clientHeight/ROWS;
    const pad=Math.max(1, Math.floor(Math.min(cw,ch)*0.08));
    const px=Math.floor(x*cw)+pad, py=Math.floor(y*ch)+pad;
    const pw=Math.floor(cw-pad*2), ph=Math.floor(ch-pad*2);
    if (!micReady){
      const color = kind==="golden" ? cfg.colors.golden : (kind==="rotten" ? cfg.colors.rotten : cfg.colors.food);
      drawCellRect(x,y,color); return;
    }
    ctx.drawImage(mic, px, py, pw, ph);
    let tint = null;
    if (kind==="golden") tint = cfg.colors.golden;
    else if (kind==="rotten") tint = cfg.colors.rotten;
    if (tint){
      ctx.save(); ctx.globalCompositeOperation = "source-atop"; ctx.globalAlpha = 0.35; ctx.fillStyle = tint; ctx.fillRect(px, py, pw, ph); ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  function drawAll(){
    drawGrid();
    state.obstacles.forEach(o => drawCellRect(o.x,o.y, cfg.colors.obstacle));
    drawMicFood(state.food.x, state.food.y, state.food.kind);
    for (let i=state.snake.length-1;i>=0;i--){
      const seg=state.snake[i];
      const col = i===0 ? cfg.colors.snakeHead : cfg.colors.snakeBody;
      drawCellRect(seg.x, seg.y, col);
    }
  }

  function overlayTitle(t){ const el=document.getElementById("overlayTitle"); if (el) el.textContent=t; }
  function overlayDesc(html){ const p=overlay.querySelector(".card p"); if (p) p.innerHTML = html; }
  function showGameOver(){
    overlayTitle("Game Over");
    const card = overlay.querySelector(".card");
    card.innerHTML = `<h2>Game Over</h2><p>Final score: <b>${state.score}</b><br><br><b>R</b> / <b>Space</b> to restart.</p><div class="controls"><button class="btn primary" id="restartBtn">Restart</button></div>`;
    overlay.classList.add("show");
    $("#restartBtn").onclick = () => { startGame(); };
  }
  function showWin(){
    overlayTitle("YOU WIN!");
    const card = overlay.querySelector(".card");
    card.innerHTML = `<h2>YOU WIN!</h2>
      <p class="final-big">CONGRATS SCAVENGER!<br><br>YOUR FINAL CLUE TO LOCATE PRIZE IS<br><br><span style="font-size:1.1em;">BBL 5061</span></p>
      <p>Legendary. You reached <b>${state.score}</b> points.<br><br><b>R</b> / <b>Space</b> to play again.</p>
      <div class="controls"><button class="btn primary" id="restartBtn2">Play Again</button></div>`;
    overlay.classList.add("show");
    $("#restartBtn2").onclick = () => { startGame(); };
  }
  function gameOver(){
    state.over = true;
    if (state.score > best){ best = state.score; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = best; }
    showGameOver();
  }
  function youWin(){
    state.win = true;
    if (state.score > best){ best = state.score; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = best; }
    showWin();
  }

  // --- Code Gate (robust) ---
  const unlockBtn = $("#unlockBtn");
  const codeInput = $("#codeInput");
  const codeErr = $("#codeErr");
  const PASS = "slvlog2.0";
  function normalize(s){ return (s || "").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,""); }
  const PASS_N = normalize(PASS);

  function showIntroMission(){
    introCard.innerHTML = `
      <h2 id="overlayTitle">Mission Brief</h2>
      <p class="big-red" id="introLine">GREAT JOB COMING THIS FAR!</p>
      <div class="controls"><button class="btn primary" id="nextBtn">Next</button></div>
      <p class="mobile-note">Tip: Use a physical keyboard for best control.</p>
    `;
    const nextBtn = document.getElementById("nextBtn");
    let step = 0;
    nextBtn.addEventListener("click", async () => {
      if (!audio){ initAudio(); try { await audio.resume(); } catch(e){} }
      if (step === 0){
        document.getElementById("introLine").textContent = "FOR NEXT MISSION SELECT THE BEST GAMER IN YOUR TEAM. done and proceed to game";
        nextBtn.textContent = "Start Game";
        step = 1; playSeq([67, 71, 74], 120);
      } else {
        overlay.classList.remove("show");
        newGame();
        startLoop();
      }
    });
  }

  function tryUnlock(){
    const raw = (codeInput.value || "").trim();
    const entered = normalize(raw);
    if (!audio){ initAudio(); try { audio.resume(); } catch(e){} }
    if (entered === PASS_N){
      codeErr.textContent = "";
      playSeq([72, 76, 79], 100);
      showIntroMission();
    } else {
      codeErr.textContent = "Code failed";
      playSeq([48, 46, 43], 120, "square", 0.2);
      codeInput.focus();
      codeInput.select();
    }
  }
  if (unlockBtn) unlockBtn.addEventListener("click", tryUnlock);
  if (codeInput) codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  function startGame(){
    overlay.classList.remove("show");
    // After restart, show the code gate again
    setTimeout(() => {
      overlay.classList.add("show");
      introCard.innerHTML = `
        <h2 id="overlayTitle">Enter Code</h2>
        <p class="big-red">ENTER YOUR CODE TO UNLOCK NEXT TASK</p>
        <input id="codeInput" class="txt" type="password" placeholder="Enter code..." autocomplete="off" inputmode="text" />
        <div class="controls"><button class="btn primary" id="unlockBtn">Unlock</button></div>
        <div id="codeErr" class="err"></div>
        <p class="mobile-note">Hint: The code is for SLVLOG 2.0</p>
      `;
      const _unlockBtn = document.getElementById("unlockBtn");
      const _codeInput = document.getElementById("codeInput");
      const _codeErr = document.getElementById("codeErr");
      function _try(){
        const raw = (_codeInput.value || "").trim();
        const entered = normalize(raw);
        if (!audio){ initAudio(); try { audio.resume(); } catch(e){} }
        if (entered === PASS_N){ _codeErr.textContent=""; playSeq([72,76,79],100); showIntroMission(); }
        else { _codeErr.textContent = "Code failed"; playSeq([48,46,43],120,"square",0.2); _codeInput.focus(); _codeInput.select(); }
      }
      _unlockBtn.addEventListener("click", _try);
      _codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") _try(); });
      _codeInput.focus();
    }, 50);
    newGame(); startLoop();
  }

  // initial layout and grid draw
  resizeCanvas(); drawGrid();
})();
</script>
</body>
</html>
